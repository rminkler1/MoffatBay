<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
  "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:f="http://java.sun.com/jsf/core"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:ui="http://java.sun.com/jsf/facelets">

<h:head>
  <title><ui:insert name="title">My Account</ui:insert></title>
  <h:outputStylesheet name="styles.css" library="css" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;600&amp;family=Old+Standard+TT:wght@400;700&amp;display=swap" rel="stylesheet" />
  <link rel="shortcut icon" type="image/x-icon" href="#{resource['images/favicon.ico']}" />

  <style>
    body {
      margin: 0;
      font-family: "IBM Plex Sans", sans-serif;
      background-color: #f5f5f5;
    }

    .account-wrapper {
      max-width: 960px;
      margin: 120px auto;
      padding: 60px 30px;
      background-color: #ffffff;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }

    .account-header {
      text-align: center;
      margin-bottom: 50px;
    }

    .account-header h1 {
      font-family: "Old Standard TT", serif;
      font-size: 2.75em;
      font-weight: 700;
      margin-bottom: 10px;
      color: #222;
    }

    .account-header p {
      font-size: 1.1em;
      color: #555;
      margin-top: 0;
    }

    .account-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
    }

    .account-field {
      display: flex;
      flex-direction: column;
    }

    .account-field label {
      font-weight: 600;
      font-size: 0.95em;
      color: #333;
      margin-bottom: 6px;
    }

    .account-field span {
      background-color: #fafafa;
      padding: 14px 18px;
      border-radius: 8px;
      font-size: 1.05em;
      border: 1px solid #e1e1e1;
      color: #444;
    }

    .button-row {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 20px;
      margin-top: 60px;
    }

    .edit-button,
    .delete-button {
      font-family: "IBM Plex Sans", sans-serif;
      font-size: 1em;
      padding: 12px 30px;
      border-radius: 6px;
      border: none;
      text-decoration: none;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .edit-button {
      background-color: #1d3557;
      color: white;
    }

    .edit-button:hover {
      background-color: #274472;
    }

    .delete-button {
      background-color: #c0392b;
      color: white;
    }

    .delete-button:hover {
      background-color: #a93226;
    }

    @media (max-width: 768px) {
      .account-grid {
        grid-template-columns: 1fr;
      }

      .account-wrapper {
        margin: 80px 16px;
        padding: 40px 20px;
      }
    }
  </style>
</h:head>

<h:body>
  <f:view>

    <!-- Header -->
    <ui:insert name="header">
      <ui:include src="/templates/header.xhtml" />
    </ui:insert>

    <div class="account-wrapper">
      <div class="account-header">
        <h1>My Account</h1>
        <p>Manage your details and preferences</p>
      </div>

      <div class="account-grid">
        <div class="account-field">
          <label>UID</label>
          <span><h:outputText value="#{userBean.uid}" /></span>
        </div>

        <div class="account-field">
          <label>Name</label>
          <span><h:outputText value="#{userBean.name}" /></span>
        </div>

        <div class="account-field">
          <label>Email</label>
          <span><h:outputText value="#{userBean.email}" /></span>
        </div>

        <div class="account-field">
          <label>Phone</label>
          <span><h:outputText value="#{userBean.phone}" /></span>
        </div>

        <div class="account-field">
          <label>Comments</label>
          <span><h:outputText value="#{userBean.comments}" /></span>
        </div>

        <div class="account-field">
          <label>Google ID</label>
          <span><h:outputText value="#{userBean.googleId}" /></span>
        </div>
      </div>

      <div class="button-row">
        <h:link outcome="editAccount" styleClass="edit-button">Edit Profile</h:link>

        <h:form>
          <h:commandButton value="Delete Account"
                           action="#{userBean.deleteAccount}"
                           styleClass="delete-button"
                           onclick="return confirm('Are you sure you want to delete your account? This action cannot be undone.');" />
        </h:form>
      </div>
    </div>

    <!-- Footer -->
    <ui:insert name="footer">
      <ui:include src="/templates/footer.xhtml" />
    </ui:insert>

  </f:view>
</h:body>
</html>
